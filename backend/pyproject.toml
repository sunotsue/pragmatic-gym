[project]
name = "pragmatic-gym"
version = "0.3.0"
description = "Research workbench for teaching language models social intelligence through interaction"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "numpy>=1.26", "pandas>=2.2",
  "scipy>=1.13", "statsmodels>=0.14", "gymnasium>=1.0", "pyyaml>=6", "anthropic>=1.0", "httpx>=0.27",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.4", "transformers>=5.0", "peft>=0.15", "trl>=1.0", "datasets>=3.0", "accelerate>=1.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pgym*"]
