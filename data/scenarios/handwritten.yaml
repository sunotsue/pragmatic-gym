- id: same_page
  domain: relationship
  capability: history_dependent
  capabilities: [history_dependent, belief_revision]
  title: Are We on the Same Page?
  speaker: Robin
  relationship: Seeing each other
  context:
    - You and Robin have been seeing each other for four months. You've met each other's friends.
    - A month ago you hinted at 'what we are' and Robin changed the subject to weekend plans.
  history:
    - [You, "Can I ask something kind of big? Where do you see this going?", "Tonight"]
    - [Robin, "I really like what we have right now.", "Tonight"]
  reference: {content_open: 0.25, prefers_status_quo: 0.30, hesitant_wants_more: 0.15, avoiding_talk: 0.30}
  rationale: >-
    The words are warm but answer a different question than the one asked; combined with one earlier deflection,
    preference for the status quo and avoidance are as plausible as contentment. Genuinely ambiguous — no single reading should get high confidence.
  hidden: {true_intent: hesitant_wants_more, private_state: "Robin is recently out of a long relationship and scared of moving fast, but wants this to work."}
  why_hidden_matters: Sharing your own view without demanding a label can draw out hesitance; demanding a definition or assuming either extreme backfires.
  counterfactuals:
    - id: exclusive_said
      change: Last month Robin said they aren't seeing anyone else and don't want to.
      context_replace:
        - You and Robin have been seeing each other for four months. You've met each other's friends.
        - Last month Robin told you, unprompted, that they're not seeing anyone else and don't want to.
      reference: {content_open: 0.50, prefers_status_quo: 0.08, hesitant_wants_more: 0.32, avoiding_talk: 0.10}
      rationale: A prior explicit commitment shifts the same sentence towards contentment or cautious wanting more.
    - id: ex_visit
      change: Robin just got back from a weekend visiting an ex.
      context_add: ["Robin just got back from a weekend visiting an ex 'as friends'."]
      reference: {content_open: 0.12, prefers_status_quo: 0.45, hesitant_wants_more: 0.08, avoiding_talk: 0.35}
      rationale: New information increases the status-quo and avoidance readings.

