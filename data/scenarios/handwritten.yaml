      change: There's no anniversary, and you both loved the rooftop.
      context_replace:
        - Your first date with Sam was at a small ramen place downtown, about a year ago.
        - Last weekend you both went to a rooftop bar and said it was the best night you'd had in months.
        - Over the summer you stayed at a cabin with friends.
      reference: {referent_a: 0.15, referent_b: 0.60, referent_c: 0.05, unclear: 0.20}
