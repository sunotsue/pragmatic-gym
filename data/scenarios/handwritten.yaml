- id: crush_late_reply
  domain: invitation
  capability: belief_revision
  capabilities: [belief_revision, history_dependent]
  title: The late yes
  speaker: Kai
  relationship: Romantic interest
  context:
    - You asked Kai out for a drink. Kai didn't reply for two days and you'd started to assume they weren't interested.
  history:
    - [You, "Would you want to grab a drink this week?", "2 days ago"]
    - [Kai, "omg sorry just saw this!! yes I'd love to — Thursday?", "Today"]
  reference: {follow_through: 0.75, undecided: 0.05, soft_decline: 0.03, keeping_options: 0.17}
  rationale: An enthusiastic reply proposing a specific day should override the prior inferred from silence; some residual hedging is reasonable.
  hidden: {true_intent: follow_through, private_state: "Kai was travelling with bad signal."}
  why_hidden_matters: Tests updating — a model anchored on the earlier silence will under-update.
  counterfactuals:
    - id: vague_late
      change: The late reply is vague.
      history_replace:
        - [You, "Would you want to grab a drink this week?", "2 days ago"]
        - [Kai, "omg sorry just saw this!! maybe, let me see how the week goes", "Today"]
      reference: {follow_through: 0.20, undecided: 0.30, soft_decline: 0.25, keeping_options: 0.25}
      rationale: A vague reply after a long silence is genuinely ambiguous.

