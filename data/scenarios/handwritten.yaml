      change: Diane asks for the recipe a minute later.
      history_replace:
        - [Diane, "Oh — you made the potatoes this way. Interesting.", "Tonight"]
        - [Diane, "You'll have to write this down for me.", "Tonight"]
      reference: {sincere_positive: 0.65, tactful_negative: 0.08, mixed_ambivalent: 0.22, distracted: 0.05}
      rationale: Asking for the recipe is strong evidence the comment was positive.

- id: grandma_forever
  domain: family
  capability: politeness_power
  capabilities: [politeness_power, emotional_repair]
  title: "“I won't be around forever”"
  speaker: Grandma
  relationship: Grandparent
  context:
    - Your grandmother is 84 and in good health. You last visited at New Year.
  history:
    - [You, "Sorry Grandma, I can't make it this weekend after all", "Today"]
    - [Grandma, "That's alright. I won't be around forever, you know.", "Today"]
  reference: {neutral_observation: 0.05, concern_wellbeing: 0.05, indirect_request: 0.55, mild_reproach: 0.35}
  rationale: Following a cancellation, the line is most plausibly a request to visit with some reproach; it is rarely a neutral remark.
  hidden: {true_intent: indirect_request, private_state: "She was planning to cook your favourite dish."}
  why_hidden_matters: Reassurance with a concrete new date addresses the request; defending or changing the subject escalates.
  counterfactuals:
    - id: joking_tone
      change: She says it laughing, as a running family joke, while asking about your trip.
      history_replace:
        - [You, "Sorry Grandma, I can't make it this weekend after all", "Today"]
        - [Grandma, "Haha that's alright — I won't be around forever, you know 😜 Now tell me about your trip!", "Today"]
      reference: {neutral_observation: 0.40, concern_wellbeing: 0.05, indirect_request: 0.40, mild_reproach: 0.15}
      rationale: The joking frame and topic change weaken the reproach; a softer request remains plausible.

- id: that_place
  domain: reference
  capability: common_ground
  capabilities: [common_ground]
  title: "“That place”"
  speaker: Sam
  relationship: Partner
  options:
    referent_a: "The ramen place from your first date"
    referent_b: "The rooftop bar from last weekend"
    referent_c: "The cabin from the summer trip"
  context:
    - Tomorrow is your one-year anniversary with Sam. Your first date was at a small ramen place downtown.
    - Last weekend you both went to a rooftop bar and agreed it was too loud.
    - Over the summer you stayed at a cabin with friends.
  history:
    - [Sam, "Want to go back to that place tomorrow? ❤️", "Today"]
  reference: {referent_a: 0.65, referent_b: 0.05, referent_c: 0.10, unclear: 0.20}
  rationale: The anniversary and the heart make the first-date place the most salient shared referent; the rooftop is dispreferred by shared opinion.
  hidden: {true_intent: referent_a}
  why_hidden_matters: Confirming the best guess is efficient and warm; asking 'which place?' signals the anniversary isn't salient to you.
  counterfactuals:
