# Pragmatic Gym — hand-written scenario corpus (v0.3)
#
# Every scenario is SYNTHETIC and authored by the researcher. `reference` is an
# authored hypothesis about what a careful observer could reasonably infer from
# the observable context — NOT a measured human consensus. Where readings are
# genuinely ambiguous the reference distribution says so (no forced single
# ground truth). `hidden` holds one concrete latent state for the researcher
# view; it is never shown to models and is not the evaluation target.
#
# History rows are [sender, text, time]. "You" is the listener.
# All scenarios are held out from training (split: eval_handwritten).

- id: soft_no_birthday
  domain: invitation
  capability: indirect_speech
  capabilities: [indirect_speech, history_dependent]
  title: The Soft No
  speaker: Jordan
  relationship: Close friend
  context:
    - Jordan is one of your closest friends from university.
    - Jordan didn't come to the last two things you invited them to — once they said they were tired, once they didn't reply until the day after.
  history:
    - [You, "Trivia night Thursday? 🧠", "5 weeks ago"]
    - [Jordan, "Ahh maybe! I'll let you know", "5 weeks ago"]
    - [You, "Picnic in the park Sunday if the weather holds?", "2 weeks ago"]
    - [Jordan, "omg sorry just seeing this, how was it??", "2 weeks ago"]
    - [You, "I'm doing a little dinner for my birthday Saturday at 7 — would love for you to be there 🎂", "Today"]
    - [Jordan, "That sounds fun. I'll let you know!", "Today"]
  reference: {follow_through: 0.12, undecided: 0.28, soft_decline: 0.45, keeping_options: 0.15}
  rationale: >-
    Two consecutive non-attendances after hedged replies make a polite decline the single most likely reading,
    but nothing in the context rules out genuine uncertainty — the earlier misses had plausible innocent explanations.
    A well-calibrated reader should lean towards 'polite no' without treating it as certain.
  hidden: {true_intent: soft_decline, private_state: "Jordan is going through a breakup and doesn't feel social, but would be hurt to stop being invited."}
  why_hidden_matters: The latent reason means pressure would be especially costly, while a warm release keeps the friendship open.
  counterfactuals:
    - id: explained_busy
      change: Jordan had explained they were swamped and missed everyone.
      context_add: ["Last week Jordan told you: 'work has been insane, but I really miss you all — keep inviting me!'"]
      reference: {follow_through: 0.30, undecided: 0.45, soft_decline: 0.15, keeping_options: 0.10}
      rationale: An explicit request to keep being invited makes the literal reading (genuinely undecided) the most plausible.
    - id: reliable_history
      change: Jordan has always followed through after saying "I'll let you know".
      context_replace: ["Jordan is one of your closest friends from university.", "Whenever Jordan says 'I'll let you know', they always do — usually within a day."]
      history_replace:
        - [You, "I'm doing a little dinner for my birthday Saturday at 7 — would love for you to be there 🎂", "Today"]
        - [Jordan, "That sounds fun. I'll let you know!", "Today"]
      reference: {follow_through: 0.50, undecided: 0.38, soft_decline: 0.06, keeping_options: 0.06}
      rationale: Same words, but a history of follow-through makes the phrase a reliable promise to answer, not a refusal.

- id: ski_trip_cost
  domain: invitation
  capability: indirect_speech
  capabilities: [indirect_speech, politeness_power]
  title: The expensive yes
  speaker: Priya
  relationship: Close friend
  context:
    - You're organising a ski weekend with friends; the cabin and lift passes come to about $600 each.
    - Priya mentioned last month that she's saving to move apartments.
  history:
    - [You, "Ski weekend in Feb!! ~$600 all in. You in? ⛷️", "Today"]
    - [Priya, "Ooh that's a lot for me right now, but it sounds amazing", "Today"]
  reference: {follow_through: 0.10, undecided: 0.30, soft_decline: 0.45, keeping_options: 0.15}
  rationale: Naming the cost is a common face-saving way to decline; 'sounds amazing' preserves the relationship. It could also be a genuine request for a cheaper option.
  hidden: {true_intent: undecided, private_state: "Priya would come if it cost under $300 but feels awkward saying so."}
  why_hidden_matters: An alternative (cheaper option) is valuable here; assuming yes or pressuring are both costly.
  counterfactuals:
    - id: offered_cover
      change: You already offered to cover the cabin share for anyone who needs it.
      context_add: ["In your first message to the group, you said you'd happily cover the cabin share for anyone tight on money."]
      reference: {follow_through: 0.20, undecided: 0.30, soft_decline: 0.40, keeping_options: 0.10}
      rationale: The cost objection persisting despite an offer weakly increases the decline reading; still ambiguous.

- id: mom_busy
  domain: family
  capability: indirect_speech
  capabilities: [indirect_speech, politeness_power]
  title: The Family Subtext
  speaker: Mom
  relationship: Parent
  context:
    - Your mom lives alone two hours away.
    - You used to call every Sunday; it's been three weeks since your last call.
  history:
    - [You, "Hi Mom! Sorry, I missed your call earlier", "Today"]
    - [Mom, "You must be very busy these days.", "Today"]
  reference: {neutral_observation: 0.12, concern_wellbeing: 0.18, indirect_request: 0.50, mild_reproach: 0.20}
  rationale: A broken routine plus a missed call makes an indirect request for contact the most likely reading; concern and mild reproach remain plausible and are not mutually exclusive with it.
  hidden: {true_intent: indirect_request, private_state: "Mom has been feeling isolated since a friend moved away."}
  why_hidden_matters: A concrete plan to talk meets the latent need; a literal 'yes, so busy' misses it.
  counterfactuals:
    - id: promotion_news
      change: You just told her you started a demanding new role and she was thrilled.
      context_replace: ["Your mom lives alone two hours away.", "Yesterday you told her about your big new role at work; she was thrilled and said she's proud of you."]
      reference: {neutral_observation: 0.35, concern_wellbeing: 0.40, indirect_request: 0.20, mild_reproach: 0.05}
      rationale: Fresh shared knowledge about a demanding job makes a sympathetic observation or concern more likely than a request.

- id: toast_venue
  domain: feedback
  capability: implicature
  capabilities: [implicature]
  title: "“The venue was gorgeous”"
  speaker: Leila
  relationship: Close friend
  context:
    - You gave a toast at your sister's wedding last night. You were nervous and lost your place once.
    - Leila was at your table.
  history:
    - [You, "Be honest — how was my toast? 😬", "Today"]
    - [Leila, "The venue was absolutely gorgeous!! And the food 😍", "Today"]
  reference: {sincere_positive: 0.08, tactful_negative: 0.50, mixed_ambivalent: 0.27, distracted: 0.15}
  rationale: >-
    The answer conspicuously addresses something other than the question (a relevance implicature). That most often
    signals tactful avoidance, but it can also be enthusiasm spilling over or simply not having strong views.
  hidden: {true_intent: mixed_ambivalent, private_state: "Leila thought the start was shaky but the ending was lovely."}
  why_hidden_matters: Inviting honesty would surface useful, kind feedback; taking it as praise misreads the reply.
  counterfactuals:
    - id: away_during_toast
      change: Leila was outside on a phone call during the toast.
      context_add: ["You noticed Leila step outside to take a phone call just before your toast started."]
      reference: {sincere_positive: 0.05, tactful_negative: 0.20, mixed_ambivalent: 0.10, distracted: 0.65}
      rationale: If she likely missed it, deflection is better explained by not having seen it than by tact.
    - id: cried_earlier
      change: Leila told you last night the toast made her cry.
      context_add: ["Right after the toast, Leila hugged you and said it made her cry."]
      reference: {sincere_positive: 0.55, tactful_negative: 0.10, mixed_ambivalent: 0.20, distracted: 0.15}
      rationale: Prior explicit praise makes the topic shift look like enthusiasm about the whole evening, not avoidance.

- id: curry_interesting
  domain: feedback
  capability: implicature
  capabilities: [implicature, emotional_repair]
  title: "“It's… really interesting!”"
  speaker: Riley
  relationship: Partner
  context:
    - You cooked for Riley for the first time — a curry from your grandmother's recipe.
  history:
    - [You, "Ok so how is it?? Honest opinion", "Tonight"]
    - [Riley, "It's… really interesting! I've never had anything like it.", "Tonight"]
  reference: {sincere_positive: 0.20, tactful_negative: 0.45, mixed_ambivalent: 0.30, distracted: 0.05}
  rationale: '"Interesting" plus a pause is a well-known hedge for dislike, but novelty can be sincerely interesting.'
  hidden: {true_intent: tactful_negative, private_state: "Riley finds it too spicy but doesn't want to hurt you because it's a family recipe."}
  why_hidden_matters: Inviting honesty gently (e.g. about spice) is better than either fishing for praise or self-deprecating.
  counterfactuals:
    - id: seconds
      change: Riley is already on a second plate.
      context_add: ["Riley has already gone back for a second plate."]
      reference: {sincere_positive: 0.60, tactful_negative: 0.10, mixed_ambivalent: 0.25, distracted: 0.05}
      rationale: Behaviour contradicts the hedge reading; 'interesting' is more likely literal curiosity.

- id: some_photos
  domain: feedback
  capability: implicature
  capabilities: [implicature]
  title: "“Some of them came out really nice”"
  speaker: Theo
  relationship: Friend
  context:
    - You volunteered to take photos at Theo's engagement party and sent him 80 edited photos.
  history:
    - [You, "Did you like the photos?? 📸", "Today"]
    - [Theo, "Some of them came out really nice!", "Today"]
  reference: {sincere_positive: 0.20, tactful_negative: 0.15, mixed_ambivalent: 0.55, distracted: 0.10}
  rationale: Scalar implicature — choosing 'some' over 'all/most' suggests not all of them worked for him, without implying he's displeased overall.
  hidden: {true_intent: mixed_ambivalent, private_state: "Theo loved about a third and found many blurry."}
  why_hidden_matters: Asking which ones he liked is useful; assuming he loved them all, or that he hated them, are both errors.
  counterfactuals:
    - id: all_of_them
      change: Theo says "All of them came out really nice!"
      history_replace:
        - [You, "Did you like the photos?? 📸", "Today"]
        - [Theo, "All of them came out really nice!", "Today"]
      reference: {sincere_positive: 0.75, tactful_negative: 0.05, mixed_ambivalent: 0.10, distracted: 0.10}
      rationale: Removing the scalar term removes the implicature; this is a manipulation check on the word 'some'.

- id: brother_loan
  domain: family
  capability: politeness_power
  capabilities: [politeness_power, indirect_speech]
  title: "“No rush on the money”"
  speaker: Marcus
  relationship: Older brother
  context:
    - Your older brother Marcus lent you $800 four months ago; you said you'd pay it back 'in a few weeks'.
    - Marcus doesn't usually talk about money.
  history:
    - [Marcus, "Btw, no rush on the money. Whenever.", "Today"]
  reference: {neutral_observation: 0.30, concern_wellbeing: 0.10, indirect_request: 0.45, mild_reproach: 0.15}
  rationale: Raising the topic unprompted after the promised window has passed is a common indirect reminder; the literal reassurance is still plausible.
  hidden: {true_intent: indirect_request, private_state: "Marcus has a big bill due next month and is embarrassed to ask."}
  why_hidden_matters: Proposing a concrete repayment plan meets the latent need while honouring the face-saving framing.
  counterfactuals:
    - id: car_broke
      change: Marcus mentioned yesterday that his car broke down.
      context_add: ["Yesterday Marcus mentioned his car broke down and the repair will be expensive."]
      reference: {neutral_observation: 0.10, concern_wellbeing: 0.05, indirect_request: 0.70, mild_reproach: 0.15}
      rationale: A new, shared fact about his finances makes the reminder reading much more likely.
    - id: just_lent_again
      change: Marcus brings it up while offering to lend more.
      history_replace:
        - [You, "Rent is brutal this month 😩", "Today"]
        - [Marcus, "Need more help? Btw, no rush on the money. Whenever.", "Today"]
      reference: {neutral_observation: 0.70, concern_wellbeing: 0.20, indirect_request: 0.07, mild_reproach: 0.03}
      rationale: In the context of offering more help, the reassurance is very likely sincere.

- id: inlaw_potatoes
  domain: feedback
  capability: politeness_power
  capabilities: [politeness_power, implicature]
  title: "“Oh, you made them this way”"
  speaker: Diane
  relationship: Partner's mother
  context:
    - You're hosting your partner's parents for the first time. You made the potatoes your own way rather than the family recipe.
    - Diane is warm but traditional about family dishes.
  history:
    - [Diane, "Oh — you made the potatoes this way. Interesting.", "Tonight"]
  reference: {sincere_positive: 0.15, tactful_negative: 0.45, mixed_ambivalent: 0.25, distracted: 0.15}
  rationale: Marking the deviation from the family version with 'interesting' is a familiar soft criticism, but it might be neutral curiosity.
  hidden: {true_intent: mixed_ambivalent, private_state: "Diane is surprised, a little attached to her version, but likes the taste."}
  why_hidden_matters: An open, non-defensive reply works across readings; self-deprecation or fishing are costly with an in-law.
  counterfactuals:
